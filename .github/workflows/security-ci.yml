name: security-ci

# Week 2 Task 6 - adapted from labs/week15-devsecops-pipeline/security-ci.yml.
# Runs Semgrep (SAST), Gitleaks (secret scanning) and Trivy (SCA + secrets) on
# every push/PR and FAILS the build on any finding / HIGH-CRITICAL issue.
# Tools are installed as binaries in the runner (no docker-in-docker), so the
# same workflow works on GitHub-hosted runners and locally with `act`.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET: labs/week02-sdlc-tooling/vulnerable-repo

jobs:
  security-gate:
    name: Security gate (Semgrep + Gitleaks + Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install scanners
        run: |
          python3 -m venv /opt/scanners-venv
          /opt/scanners-venv/bin/pip install --quiet semgrep
          echo "/opt/scanners-venv/bin" >> "$GITHUB_PATH"
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          curl -sSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Semgrep (SAST) - fail on any finding
        run: |
          # The repo's .semgrepignore deliberately excludes teaching labs, so the
          # gate scans a clean copy of the target to keep this exercise honest.
          rm -rf /tmp/gate-target && cp -r "$TARGET" /tmp/gate-target
          semgrep --config p/default --config p/owasp-top-ten --error /tmp/gate-target

      - name: Gitleaks (secret scanning) - fail on any leak
        if: always()
        run: gitleaks detect --no-git -s "$TARGET" --exit-code 1 -v

      - name: Trivy (SCA + secrets) - fail on HIGH/CRITICAL
        if: always()
        run: trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 "$TARGET"
